<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Analysis - Chess AI</title>
    <meta name="description" content="Replay and analyze your chess games move by move. Step forward and backward through the game.">
    <meta name="robots" content="noindex">
    <link rel="stylesheet" href="style.css?v=5">
</head>
<body>
    <div class="bg" aria-hidden="true">
        <div class="bg-layer bg-nebula"></div>
        <div class="bg-layer bg-stars-far"></div>
        <div class="bg-layer bg-stars-mid"></div>
        <div class="bg-layer bg-stars-near"></div>
        <div class="bg-vignette"></div>
    </div>
    <div class="container">
        <header>
            <h1>GAME ANALYSIS</h1>
            <p class="subtitle">Replay your game move by move</p>
        </header>

        <div class="game-area">
            <div class="board-wrap">
                <div id="board"></div>
                <div id="status" class="status"></div>
            </div>

            <aside class="side-panel">
                <div class="controls">
                    <a href="index.html" class="btn">BACK TO GAME</a>
                </div>

                <div class="nav-panel">
                    <h3>Navigation</h3>
                    <div class="nav-controls">
                        <button id="to-start" class="nav-btn" title="Go to start">&#9198;</button>
                        <button id="prev" class="nav-btn" title="Previous move">&#9664;</button>
                        <span id="move-counter" class="move-counter">Move 0 / 0</span>
                        <button id="next" class="nav-btn" title="Next move">&#9654;</button>
                        <button id="to-end" class="nav-btn" title="Go to end">&#9197;</button>
                    </div>
                </div>

                <div class="moves-panel">
                    <h3>Move List</h3>
                    <div id="moves" class="moves"></div>
                </div>
            </aside>
        </div>
    </div>

    <script type="module" src="analysis.js"></script>
</body>
</html>
